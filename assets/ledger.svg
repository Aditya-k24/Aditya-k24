<svg width="900" height="290" viewBox="0 0 900 290" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .serif { font-family: Georgia, 'Palatino Linotype', 'Times New Roman', serif; }
      .fadein { opacity: 0; animation: fin 1.4s ease-out forwards; }
      @keyframes fin { to { opacity: 1; } }
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="288" rx="14" fill="#070b1e" stroke="#28304f" stroke-width="2"/>

  <text x="450" y="48" text-anchor="middle" class="serif" font-size="13" letter-spacing="6" fill="#8b93ad">FIELD NOTES</text>
  <line x1="410" y1="62" x2="490" y2="62" stroke="#28304f" stroke-width="1"/>

  <g class="serif" font-size="15">
    <g class="fadein" style="animation-delay:0.2s">
      <text x="120" y="105" fill="#6fd6c8" font-size="14">I.</text>
      <text x="160" y="105" fill="#dfe6f5">Reading for an MS in Computer Science at NC State,</text>
      <text x="160" y="128" fill="#8b93ad" font-style="italic">where the coffee is theory and the deadlines are practice.</text>
    </g>
    <g class="fadein" style="animation-delay:0.7s">
      <text x="120" y="168" fill="#6fd6c8" font-size="14">II.</text>
      <text x="160" y="168" fill="#dfe6f5">Product Engineer Intern at Isomer AI · Graduate Research Assistant,</text>
      <text x="160" y="191" fill="#8b93ad" font-style="italic">published in IEEE — semantic search, LLM evaluation, agentic systems.</text>
    </g>
    <g class="fadein" style="animation-delay:1.2s">
      <text x="120" y="231" fill="#6fd6c8" font-size="14">III.</text>
      <text x="160" y="231" fill="#dfe6f5">Six hackathons won by one stubborn principle:</text>
      <text x="160" y="254" fill="#8b93ad" font-style="italic">ship the smallest thing that proves the biggest idea.</text>
    </g>
  </g>
</svg>
