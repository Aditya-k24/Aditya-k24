<svg width="440" height="170" viewBox="0 0 440 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs><style>
    .mono { font-family: 'Courier New', Courier, monospace; }
    .led { animation: led 1.6s ease-in-out infinite; }
    @keyframes led { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    .sweep { animation: sweep 5s linear infinite; }
    @keyframes sweep { from { transform: translateX(-120px); } to { transform: translateX(560px); } }
  </style>
  <clipPath id="cf"><rect width="440" height="170" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#cf)">
    <rect width="440" height="170" rx="10" fill="#0a0e1a"/>
    <g class="sweep"><rect x="0" y="0" width="60" height="170" fill="#0aff9d" opacity="0.04" transform="skewX(-20)"/></g>
    <rect x="0" y="0" width="5" height="170" fill="#0aff9d"/>
    <circle cx="415" cy="24" r="5" fill="#0aff9d" class="led"/>
    <text x="408" y="29" text-anchor="end" class="mono" font-size="10" fill="#0aff9d" letter-spacing="1">ROUTING</text>
    <text x="24" y="38" class="mono" font-size="20" font-weight="bold" fill="#e6edf3">sieve</text>
    <text x="24" y="68" class="mono" font-size="12" fill="#8b949e">Terminal-native router for Claude Code — cheap prompts</text>
    <text x="24" y="88" class="mono" font-size="12" fill="#8b949e">hit local Ollama, hard ones hit real Claude</text>
    <text x="24" y="122" class="mono" font-size="11" fill="#0aff9d">[ python ] [ ollama ] [ claude ] [ cli ]</text>
    <text x="24" y="150" class="mono" font-size="11" fill="#4d5866">└─&gt; click to open ::</text>
    <rect x="1" y="1" width="438" height="168" rx="10" stroke="#1b2a3a" stroke-width="2"/>
  </g>
</svg>
