<svg width="440" height="212" viewBox="0 0 440 212" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>.serif { font-family: Georgia, 'Palatino Linotype', 'Times New Roman', serif; }</style>
    <clipPath id="art"><rect x="32" y="26" width="376" height="96"/></clipPath>
  </defs>
  <rect x="1" y="1" width="438" height="210" rx="12" fill="#13161f" stroke="#2a2f3d" stroke-width="2"/>

