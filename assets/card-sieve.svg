  <rect x="22" y="16" width="396" height="116" fill="none" stroke="#eae7de" stroke-width="2" opacity="0.85"/>
  <rect x="28" y="22" width="384" height="104" fill="none" stroke="#eae7de" stroke-width="0.8" opacity="0.35"/>

