<svg width="900" height="330" viewBox="0 0 900 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'Courier New', Courier, monospace; font-size: 14px; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    </style>
    <!-- typewriter reveal clips -->
    <clipPath id="l1"><rect x="0" y="66" height="20" width="0"><animate attributeName="width" from="0" to="900" begin="0.5s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="0" y="96" height="120" width="0"><animate attributeName="width" from="0" to="900" begin="1.6s" dur="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="0" y="216" height="20" width="0"><animate attributeName="width" from="0" to="900" begin="2.4s" dur="1.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="0" y="246" height="50" width="0"><animate attributeName="width" from="0" to="900" begin="3.9s" dur="0.4s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="898" height="328" rx="12" fill="#0a0e1a" stroke="#1b2a3a" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="36" rx="12" fill="#0d1424"/>
  <rect x="1" y="25" width="898" height="12" fill="#0d1424"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="19" r="6" fill="#febc2e"/>
  <circle cx="64" cy="19" r="6" fill="#28c840"/>
  <text x="450" y="24" text-anchor="middle" class="mono" fill="#8b949e" font-size="12">aditya@mainframe: ~/reality</text>

  <!-- line 1: whoami -->
  <g clip-path="url(#l1)">
    <text x="24" y="80" class="mono"><tspan fill="#0aff9d">aditya@mainframe</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#00fff9">~</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">whoami --verbose</tspan></text>
  </g>

  <!-- output block -->
  <g clip-path="url(#l2)">
    <text x="24" y="112" class="mono" fill="#8b949e">├─ <tspan fill="#00fff9">role</tspan>........ MS CS @ NC State · Product Engineer Intern @ Isomer AI</text>
    <text x="24" y="136" class="mono" fill="#8b949e">├─ <tspan fill="#00fff9">research</tspan>.... Graduate Research Assistant · IEEE published</text>
    <text x="24" y="160" class="mono" fill="#8b949e">├─ <tspan fill="#00fff9">obsession</tspan>... LLM infra · semantic search · agentic systems</text>
    <text x="24" y="184" class="mono" fill="#8b949e">└─ <tspan fill="#00fff9">trophies</tspan>.... 6+ hackathon wins 🏆</text>
  </g>

  <!-- line 3: uptime -->
  <g clip-path="url(#l3)">
    <text x="24" y="230" class="mono"><tspan fill="#0aff9d">aditya@mainframe</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#00fff9">~</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">cat /proc/motivation</tspan></text>
  </g>

  <g clip-path="url(#l4)">
    <text x="24" y="262" class="mono" fill="#ff00c1">"Make the machine think. Then make it scale."</text>
  </g>

  <!-- prompt cursor -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.5s" dur="0.1s" fill="freeze"/>
    <text x="24" y="298" class="mono"><tspan fill="#0aff9d">aditya@mainframe</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#00fff9">~</tspan><tspan fill="#8b949e">$ </tspan><tspan class="cursor" fill="#e6edf3">█</tspan></text>
  </g>
</svg>
