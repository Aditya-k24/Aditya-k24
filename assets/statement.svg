<svg width="900" height="270" viewBox="0 0 900 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs><style>
    .serif { font-family: Georgia, 'Palatino Linotype', 'Times New Roman', serif; }
    .fadein { opacity: 0; animation: fin 1.6s ease-out forwards; }
    @keyframes fin { to { opacity: 1; } }
  </style></defs>
  <rect x="1" y="1" width="898" height="268" rx="14" fill="#13161f" stroke="#2a2f3d" stroke-width="2"/>

  <!-- the placard -->
  <rect x="150" y="34" width="600" height="202" rx="3" fill="#eae7de"/>
  <rect x="150" y="34" width="600" height="202" rx="3" fill="none" stroke="#c9c5b8" stroke-width="1"/>

  <text x="180" y="72" class="serif" font-size="11" letter-spacing="4" fill="#6b6f7c">ARTIST&#8217;S STATEMENT</text>
  <line x1="180" y1="84" x2="330" y2="84" stroke="#23262e" stroke-width="1" opacity="0.25"/>

  <g class="serif" fill="#23262e">
    <text x="180" y="116" font-size="16" font-style="italic" class="fadein" style="animation-delay:0.3s">&#8220;I work where intelligence meets infrastructure —</text>
    <text x="180" y="140" font-size="16" font-style="italic" class="fadein" style="animation-delay:0.7s">&#160;teaching machines to think, then teaching them to scale.&#8221;</text>
  </g>

  <g class="serif" font-size="12.5" fill="#4a4e5a">
    <text x="180" y="180" class="fadein" style="animation-delay:1.1s"><tspan font-weight="bold" fill="#23262e">SELECTED HISTORY&#160;&#160;</tspan>MS Computer Science, NC State · Product Engineer Intern, Isomer AI</text>
    <text x="180" y="200" class="fadein" style="animation-delay:1.4s"><tspan x="180">&#160;</tspan>Graduate Research Assistant · published, IEEE</text>
    <text x="180" y="222" class="fadein" style="animation-delay:1.7s"><tspan font-weight="bold" fill="#23262e">HONOURS&#160;&#160;</tspan>six hackathon wins, and counting</text>
  </g>

  <!-- pin shadows: placard mounted on wall -->
  <circle cx="160" cy="44" r="1.6" fill="#b9b5a8"/><circle cx="740" cy="44" r="1.6" fill="#b9b5a8"/>
</svg>
