<svg width="900" height="24" viewBox="0 0 900 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs><style>
    .dash { stroke: #1b2a3a; stroke-width: 2; }
    .runner { stroke: #00fff9; stroke-width: 2; stroke-dasharray: 40 860; stroke-linecap: round; animation: run 4s linear infinite; }
    @keyframes run { from { stroke-dashoffset: 900; } to { stroke-dashoffset: 0; } }
  </style></defs>
  <line x1="0" y1="12" x2="900" y2="12" class="dash"/>
  <line x1="0" y1="12" x2="900" y2="12" class="runner"/>
  <circle cx="450" cy="12" r="4" fill="#05060f" stroke="#00fff9" stroke-width="2"/>
</svg>
