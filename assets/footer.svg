<svg width="900" height="120" viewBox="0 0 900 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'Courier New', Courier, monospace; }
      .ekg { stroke: #0aff9d; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round;
             stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: beat 3.5s linear infinite; }
      @keyframes beat { 0% { stroke-dashoffset: 1200; opacity: 1; } 70% { stroke-dashoffset: 0; opacity: 1; } 90% { opacity: 0; } 100% { stroke-dashoffset: 1200; opacity: 0; } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    </style>
    <filter id="fg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="898" height="118" rx="12" fill="#05060f" stroke="#1b2a3a" stroke-width="2"/>
  <path class="ekg" filter="url(#fg)" d="M 20 60 H 180 L 200 60 L 215 30 L 230 90 L 245 45 L 258 60 H 420 L 440 60 L 455 25 L 470 95 L 485 42 L 498 60 H 660 L 680 60 L 695 30 L 710 90 L 725 45 L 738 60 H 880"/>
  <text x="450" y="105" text-anchor="middle" class="mono" font-size="12" fill="#4d5866">system alive · caffeine at nominal levels · see you in the commit log<tspan class="cursor" fill="#0aff9d"> █</tspan></text>
</svg>
