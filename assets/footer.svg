<svg width="900" height="150" viewBox="0 0 900 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs><style>
    .serif { font-family: Georgia, 'Palatino Linotype', 'Times New Roman', serif; }
    .sig { stroke-dasharray: 520; stroke-dashoffset: 520; animation: sig 3s ease-out 0.6s forwards; }
    @keyframes sig { to { stroke-dashoffset: 0; } }
  </style></defs>
  <rect x="1" y="1" width="898" height="148" rx="14" fill="#13161f" stroke="#2a2f3d" stroke-width="2"/>
  <circle cx="662" cy="127" r="1.4" fill="#4f9dde" opacity="0.57"/><circle cx="538" cy="127" r="1.4" fill="#8b7fd4" opacity="0.58"/><circle cx="476" cy="127" r="1.8" fill="#a8c8ec" opacity="0.79"/><circle cx="795" cy="122" r="1.4" fill="#3ec6b8" opacity="0.77"/><circle cx="167" cy="119" r="1.4" fill="#4f9dde" opacity="0.69"/><circle cx="394" cy="121" r="1.2" fill="#4f9dde" opacity="0.80"/><circle cx="180" cy="132" r="1.5" fill="#3ec6b8" opacity="0.48"/><circle cx="167" cy="126" r="1.6" fill="#4f9dde" opacity="0.55"/>

  <text x="450" y="58" text-anchor="middle" class="serif" font-size="16" font-style="italic" fill="#eae7de">&#8220;Art is never finished, only abandoned.&#8221;</text>
  <text x="450" y="82" text-anchor="middle" class="serif" font-size="12" letter-spacing="3" fill="#8a8f9e">— LEONARDO DA VINCI&#160;&#160;·&#160;&#160;<tspan font-style="italic" letter-spacing="0" fill="#a8c8ec">so I ship.</tspan></text>

  <!-- flourish signature line, drawing itself -->
  <path class="sig" d="M 330 108 C 380 96 420 120 450 108 S 520 96 560 110 C 545 118 530 112 570 106"
        stroke="#4f9dde" stroke-width="1.6" fill="none" stroke-linecap="round"/>
</svg>
