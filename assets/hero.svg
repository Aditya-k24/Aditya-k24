<svg width="900" height="300" viewBox="0 0 900 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aditya Kulkarni — AI Engineer and Systems Builder">
  <defs>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#22C55E" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#1E293B"/>
    </pattern>
    <clipPath id="frame"><rect width="900" height="300" rx="14"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
      .up { animation: up 0.7s cubic-bezier(0.16,1,0.3,1) forwards; }
      @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .bar { animation: bar 1s cubic-bezier(0.16,1,0.3,1) 0.9s forwards; }
      @keyframes bar { from { width: 0; } to { width: 88px; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
      .breathe { animation: breathe 8s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .up { animation: none; opacity: 1; transform: none; }
        .bar { animation: none; width: 88px; }
        .pulse, .breathe { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="300" fill="#0F172A"/>
    <rect x="520" y="0" width="380" height="300" fill="url(#dots)"/>
    <rect width="900" height="300" fill="url(#glow)" class="breathe"/>

    <!-- status pill -->
    <g class="up" style="animation-delay:0.1s">
      <rect x="60" y="52" width="196" height="30" rx="15" fill="#1E293B"/>
      <circle cx="78" cy="67" r="4" fill="#22C55E" class="pulse"/>
      <text x="92" y="72" class="sans" font-size="13" font-weight="500" fill="#94A3B8">Open to opportunities</text>
    </g>

    <!-- name -->
    <text x="58" y="148" class="sans up" font-size="54" font-weight="700" fill="#F8FAFC" letter-spacing="-1.5" style="animation-delay:0.25s">Aditya Kulkarni</text>

    <!-- accent bar -->
    <rect x="60" y="166" height="4" rx="2" fill="#22C55E" class="bar" width="88"/>

    <!-- role -->
    <text x="60" y="204" class="sans up" font-size="19" font-weight="500" fill="#94A3B8" style="animation-delay:0.45s">AI Engineer <tspan fill="#475569">·</tspan> Systems Builder <tspan fill="#475569">·</tspan> MS CS <tspan fill="#F8FAFC">@ NC State</tspan></text>

    <!-- highlights -->
    <g class="up" style="animation-delay:0.65s">
      <rect x="60" y="228" width="128" height="28" rx="14" fill="#1E293B"/>
      <text x="124" y="246" text-anchor="middle" class="sans" font-size="12.5" font-weight="500" fill="#94A3B8">Intern @ Isomer AI</text>
      <rect x="198" y="228" width="118" height="28" rx="14" fill="#1E293B"/>
      <text x="257" y="246" text-anchor="middle" class="sans" font-size="12.5" font-weight="500" fill="#94A3B8">IEEE Published</text>
      <rect x="326" y="228" width="158" height="28" rx="14" fill="#1E293B"/>
      <text x="405" y="246" text-anchor="middle" class="sans" font-size="12.5" font-weight="500" fill="#94A3B8">3× Hackathon Winner</text>
    </g>

    <!-- terminal accent, right side -->
    <g class="up" style="animation-delay:0.85s">
      <rect x="600" y="80" width="240" height="120" rx="10" fill="#0B1222" stroke="#1E293B" stroke-width="1.5"/>
      <circle cx="620" cy="100" r="4" fill="#334155"/><circle cx="634" cy="100" r="4" fill="#334155"/><circle cx="648" cy="100" r="4" fill="#334155"/>
      <text x="620" y="134" class="mono" font-size="12.5" fill="#94A3B8"><tspan fill="#22C55E">$</tspan> make intelligence</text>
      <text x="620" y="156" class="mono" font-size="12.5" fill="#94A3B8"><tspan fill="#22C55E">$</tspan> make it scale</text>
      <text x="620" y="178" class="mono" font-size="12.5" fill="#22C55E">▊<animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></text>
    </g>

    <rect x="0.75" y="0.75" width="898.5" height="298.5" rx="14" stroke="#1E293B" stroke-width="1.5"/>
  </g>
</svg>
